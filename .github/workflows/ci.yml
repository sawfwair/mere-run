name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes that require native builds
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          code_required=true
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "${BASE_SHA}^{commit}"; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if (( ${#changed_files[@]} > 0 )); then
              code_required=false
              for path in "${changed_files[@]}"; do
                case "$path" in
                  docs/*|README.md|CHANGELOG.md|CODEBASE.md|CONTRIBUTING.md|SECURITY.md|LICENSE|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/workflows/docs.yml)
                    ;;
                  *)
                    code_required=true
                    break
                    ;;
                esac
              done
            fi
          fi

          echo "code=$code_required" >>"$GITHUB_OUTPUT"
          printf 'Native builds required: %s\n' "$code_required"

  swift:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    env:
      MERERUN_SWIFT_DISABLE_INDEX_STORE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - name: Restore SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.4-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Install check dependencies
        run: |
          # macos-26 currently carries an untrusted aws/tap that causes every
          # Homebrew command to fail before resolving Homebrew/core formulae.
          brew untap --force aws/tap
          brew install swiftlint ripgrep
      - name: Run package checks
        run: ./scripts/check.sh
      - name: Build app bundle (ad-hoc)
        run: ./scripts/build_mere_run_app.sh debug
      - name: Verify bundle structure
        run: |
          set -euo pipefail
          bundle="$(swift build --disable-index-store --show-bin-path)/MereRun.app"
          test -x "${bundle}/Contents/MacOS/mere.run.app"
          test -x "${bundle}/Contents/Helpers/mere.run"
          find "${bundle}/Contents/Helpers" -maxdepth 1 -name 'libonnxruntime*.dylib' -print -quit | grep -q .
          test -f "${bundle}/Contents/Resources/ThirdPartyLicenses/THIRD_PARTY_NOTICES.md"
          "${bundle}/Contents/Helpers/mere.run" --version
          # Executable code must not live under Contents/Resources (notarization rule).
          if find "${bundle}/Contents/Resources" -type f -perm -111 \
              ! -name "*.icns" | grep -q .; then
            echo "Executable files found under Contents/Resources" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "${bundle}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "${bundle}/Contents/Info.plist"
          codesign -d --entitlements :- "${bundle}/Contents/MacOS/mere.run.app" 2>&1 \
            | grep -q 'com.apple.security.device.audio-input'
          codesign -d --entitlements :- "${bundle}/Contents/Helpers/mere.run" 2>&1 \
            | grep -q 'com.apple.security.device.audio-input'
          codesign --verify --strict --verbose=2 "$bundle"

  ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - name: Restore iOS SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: .build/ios-source-packages
          key: ios-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.4-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Install XcodeGen
        run: |
          # Keep this in sync with the native Swift job's runner workaround.
          brew untap --force aws/tap
          brew install xcodegen
      - name: Generate iOS project
        run: xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Build iOS app and tests for release
        run: |
          xcodebuild build-for-testing \
            -project apps/ios/MereRunStudio.xcodeproj \
            -scheme MereRunStudio \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath .build/ios-derived \
            -clonedSourcePackagesDirPath .build/ios-source-packages \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Run iOS unit tests
        run: |
          xcodebuild test-without-building \
            -project apps/ios/MereRunStudio.xcodeproj \
            -scheme MereRunStudio \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath .build/ios-derived \
            -clonedSourcePackagesDirPath .build/ios-source-packages \
            -only-testing:MereRunStudioTests \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify iOS release metadata
        run: |
          set -euo pipefail

          app='.build/ios-derived/Build/Products/Release-iphonesimulator/mere.run.app'
          widget="${app}/PlugIns/MereRunWidgets.appex"
          test -d "$app"
          test -d "$widget"

          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Info.plist")"
          widget_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${widget}/Info.plist")"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app}/Info.plist")"
          widget_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${widget}/Info.plist")"
          test "$app_version" = "$widget_version"
          test "$app_build" = "$widget_build"

          executable="${app}/mere.run"
          executable_archs="$(lipo -archs "$executable")"
          test "$executable_archs" = 'arm64'
          executable_bytes="$(stat -f '%z' "$executable")"
          maximum_executable_bytes="$((80 * 1024 * 1024))"
          if (( executable_bytes > maximum_executable_bytes )); then
            echo "iOS Release executable is ${executable_bytes} bytes; budget is ${maximum_executable_bytes}." >&2
            echo 'Audit MereRunCore dependencies before raising the budget.' >&2
            exit 1
          fi
          echo "iOS Release executable: ${executable_bytes} bytes (${executable_archs})"

          release_entitlements='apps/ios/MereRunStudio/MereRunStudio.entitlements'
          debug_entitlements='apps/ios/MereRunStudio/MereRunStudio.Debug.entitlements'
          grep -q '<string>applinks:mere.world</string>' "$release_entitlements"
          if grep -q 'mode=developer' "$release_entitlements"; then
            echo 'Release entitlements must not use associated-domain developer mode.' >&2
            exit 1
          fi
          grep -q '<string>applinks:mere.world?mode=developer</string>' "$debug_entitlements"

          debug_setting="$(xcodebuild -project apps/ios/MereRunStudio.xcodeproj -scheme MereRunStudio -configuration Debug -showBuildSettings | awk -F ' = ' '/CODE_SIGN_ENTITLEMENTS/ { print $2; exit }')"
          release_setting="$(xcodebuild -project apps/ios/MereRunStudio.xcodeproj -scheme MereRunStudio -configuration Release -showBuildSettings | awk -F ' = ' '/CODE_SIGN_ENTITLEMENTS/ { print $2; exit }')"
          test "$debug_setting" = 'MereRunStudio/MereRunStudio.Debug.entitlements'
          test "$release_setting" = 'MereRunStudio/MereRunStudio.entitlements'

  # Keep the existing protected-check context while the real bundle build and
  # verification share the warm SwiftPM build directory in the swift job.
  macos-app-bundle:
    needs: [changes, swift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify macOS bundle gate
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code }}
          SWIFT_RESULT: ${{ needs.swift.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGE_DETECTION_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGE_DETECTION_RESULT" >&2
            exit 1
          fi
          if [[ "$CODE_REQUIRED" == "true" && "$SWIFT_RESULT" != "success" ]]; then
            echo "macOS package and bundle checks did not succeed: $SWIFT_RESULT" >&2
            exit 1
          fi
          if [[ "$CODE_REQUIRED" != "true" && "$CODE_REQUIRED" != "false" ]]; then
            echo "Change detection returned an invalid code result: $CODE_REQUIRED" >&2
            exit 1
          fi

          echo "macOS bundle gate satisfied (code required: $CODE_REQUIRED; swift: $SWIFT_RESULT)."

  linux-cli-compatibility-docs:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify change detection
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
        run: |
          if [[ "$CHANGE_DETECTION_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGE_DETECTION_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Linux CLI compatibility documentation
        run: |
          set -euo pipefail

          grep -R "Linux CLI compatibility" README.md docs/getting-started.md docs/development-workflow.md docs/testing.md docs/repository-tour.md docs/internals/source-layout.md >/dev/null
          grep -R "MERERUN_FFMPEG" README.md docs/getting-started.md docs/development-workflow.md docs/testing.md docs/repository-tour.md docs/internals/source-layout.md >/dev/null
          grep -R "MERERUN_FFPROBE" README.md docs/getting-started.md docs/development-workflow.md docs/testing.md docs/repository-tour.md docs/internals/source-layout.md >/dev/null
          grep -R "CPU MLX" README.md docs/development-workflow.md docs/testing.md docs/repository-tour.md docs/internals/source-layout.md >/dev/null
          grep -R "CUDA" README.md docs/development-workflow.md docs/testing.md docs/repository-tour.md docs/internals/source-layout.md >/dev/null
          grep -R "macOS-only" README.md docs/getting-started.md docs/repository-tour.md docs/internals/source-layout.md >/dev/null

  linux-cli:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux check dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            ffmpeg \
            gfortran \
            git \
            gzip \
            libcurl4-openssl-dev \
            liblapacke-dev \
            libopenblas-dev \
            ninja-build \
            pkg-config \
            ripgrep \
            unzip \
            zip \
            zlib1g-dev \
            zstd
      - name: Restore SwiftPM and Linux native dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/native/linux-x86_64
            .build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-swift-6.0-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/prepare-linux-native.sh', 'scripts/linux-arm64-bf16-toolchain.sh') }}
      - name: Run Linux CLI compatibility gate
        run: ./scripts/check-linux.sh
