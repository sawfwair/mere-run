name: ci

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - name: Install check dependencies
        run: brew install swiftlint ripgrep
      - name: Run package checks
        run: ./scripts/check.sh
