# XcodeGen manifest for the iOS Studio app.
# Generate the project on a Mac:  cd ios && xcodegen generate
# The app links only the portable MereRunRelayKit product from the root
# package; no inference runtime is built for the phone in this phase.
name: MereRunStudio
options:
  bundleIdPrefix: run.mere
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
packages:
  MereRun:
    path: ..
targets:
  MereRunStudio:
    type: application
    platform: iOS
    sources:
      - MereRunStudio
    dependencies:
      - package: MereRun
        product: MereRunRelayKit
      - package: MereRun
        product: MereRunCore
      - target: MereRunWidgets
    info:
      path: MereRunStudio/Info.plist
      properties:
        NSLocalNetworkUsageDescription: mere.run connects to your own machines on your network to run the work you submit.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: MereRunStudio/MereRunStudio.entitlements
      properties:
        # ?mode=developer bypasses Apple's AASA CDN on Developer Mode
        # devices; drop the suffix for release signing.
        com.apple.developer.associated-domains:
          - applinks:mere.world?mode=developer
          - webcredentials:mere.world
        # Bonsai 27B 1-bit chat needs the expanded per-app memory ceiling.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_NAME: mere.run
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.studio.ios
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: mere.run
        SWIFT_VERSION: "6.0"
        # MereRunCore builds with C++ interoperability; importers must match.
        OTHER_SWIFT_FLAGS: -cxx-interoperability-mode=default
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # Set for device builds: MERERUN_IOS_TEAM=<team id> xcodegen generate
        # Simulator builds need no team.
        DEVELOPMENT_TEAM: ${MERERUN_IOS_TEAM}
  MereRunStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MereRunStudioUITests
    dependencies:
      - target: MereRunStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.studio.ios.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MereRunStudio
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${MERERUN_IOS_TEAM}
  MereRunWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MereRunWidgets
      - MereRunStudio/Shared
    info:
      path: MereRunWidgets/Info.plist
      properties:
        CFBundleDisplayName: mere.run
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.studio.ios.widgets
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${MERERUN_IOS_TEAM}
        SKIP_INSTALL: YES
schemes:
  MereRunStudio:
    build:
      targets:
        MereRunStudio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MereRunStudioUITests
